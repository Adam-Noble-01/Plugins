<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Overlay Entity Info</title>

  <!-- Modus & Bootstrap -->
  <link href="../vendor/modus/modus.min.css" rel="stylesheet">
  <link href="../vendor/modus/modus-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@trimble-oss/modus-bootstrap@2.0.8/dist/css/modus-bootstrap.min.css" rel="stylesheet">

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="overlay_entity.css">
</head>

<body class="p-2">
  <div class="container-fluid mt-0 px-2">

    <!-- Main Card / Header-->
    <div class="card mb-3">
      <div class="card-header d-flex align-items-center gap-2">
        <img src="../icons/inspect.svg" width="20" height="20" alt="Overlay Icon">
        <span class="fw-semibold small">Entity Info</span>

        <div class="ms-auto d-flex align-items-center gap-2">

          <div class="form-check form-switch d-flex align-items-center mb-0">
            <input class="form-check-input" type="checkbox" id="toggleLabelOverlay">
            <label class="form-check-label ms-2" for="toggleLabelOverlay"></label>
          </div>

          <button id="darkModeToggle" class="btn btn-link p-0" title="Toggle Dark Mode">
            <img src="../icons/moon.svg" alt="Toggle Theme" width="18" height="18">
          </button>
        
        </div>
      </div>

      <div class="card-body">

        <div class="btn-group w-100 mb-3" role="group">
          <input type="radio" class="btn-check" name="drawMode" id="mode3D" value="label_3d" autocomplete="off" checked>
          <label class="btn btn-outline-primary" for="mode3D">3D Labels</label>

          <input type="radio" class="btn-check" name="drawMode" id="mode2D" value="label_2d" autocomplete="off">
          <label class="btn btn-outline-primary" for="mode2D">2D Info</label>

          <input type="radio" class="btn-check" name="drawMode" id="modeBoth" value="both" autocomplete="off">
          <label class="btn btn-outline-primary" for="modeBoth">Both</label>
        </div>

        <!-- Entity Info Card -->
        <div class="card mb-3 shadow-sm">

          <div class="card-header d-flex align-items-center justify-content-between gap-2">
            <!-- Collapse toggle area -->
            <div class="d-flex align-items-center gap-2" role="button"
                data-bs-toggle="collapse"
                data-bs-target="#entityCollapse"
                aria-expanded="true"
                aria-controls="entityCollapse">
              <img src="../icons/avoidance-zone.svg" width="20" height="20" alt="Selected">
              <strong class="small fw-semibold mb-0">Overlay Info</strong>
            </div>

          </div>

          <!-- Entity Info Card-->

          <div id="entityCollapse" class="collapse">
            <div class="card-body pt-3 pb-0">

              <!-- Show Detailed Info -->
              <div class="form-check form-switch d-flex align-items-center mb-2">
                <label for="toggleEntityInfo" class="form-label small text-body-secondary mb-0 me-auto">
                  Show Detailed Info
                </label>
                <input class="form-check-input" type="checkbox" id="toggleEntityInfo" checked>
              </div>

              <!-- Detail Item Checkboxes -->
              <div id="componentDetailOptions" class="ms-3 mb-2 small">

                <h6 class="mt-3">Component Info</h6>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="showComponentDefinition" checked>
                  <label class="form-check-label" for="showComponentDefinition">
                    Show Definition Name
                  </label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="showComponentInstance" checked>
                  <label class="form-check-label" for="showComponentInstance">
                    Show Instance Name
                  </label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="showTagLabel" checked>
                  <label class="form-check-label" for="showTagLabel">
                    Show Tag Label
                  </label>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="showComponentDescription" checked>
                    <label class="form-check-label" for="showComponentDescription">
                      Show Description
                    </label>
                  </div>

                  <button id="editDescriptionBtn" title="Edit Component Description" class="edit-description-button">
                    <img src="../icons/file-edit.svg" alt="Edit" width="16" height="16">
                  </button>
                </div>

                <h6 class="mt-3">Measurement Info</h6>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="showComponentVolume" checked>
                  <label class="form-check-label" for="showComponentVolume">
                    Show Volume
                  </label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="showArea" checked>
                  <label class="form-check-label" for="showArea">
                    Show Area
                  </label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="showLength" checked>
                  <label class="form-check-label" for="showLength">
                    Show Length
                  </label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="showRadius" checked>
                  <label class="form-check-label" for="showRadius">
                    Show Radius
                  </label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="showSegments" checked>
                  <label class="form-check-label" for="showSegments">
                    Show Segments
                  </label>
                </div>

              </div>

            </div>
          </div>

        </div>

        <!-- Appearance Card -->
        <div class="card mb-3 shadow-sm">
          <div class="card-header d-flex align-items-center justify-content-between gap-2">
            <!-- Collapse toggle area -->
            <div class="d-flex align-items-center gap-2" role="button"
                data-bs-toggle="collapse"
                data-bs-target="#appearanceCollapse"
                aria-expanded="true"
                aria-controls="appearanceCollapse">
              <img src="../icons/palette.svg" width="20" height="20" alt="Appearance">
              <strong class="small fw-semibold mb-0">Appearance</strong>
            </div>
          </div>

          <div id="appearanceCollapse" class="collapse">
            <div class="card-body pt-3 pb-0">

              <!-- Font Size -->
              <div class="d-flex align-items-center justify-content-between mb-2 gap-2">
                <label for="fontSizeInput" class="form-label small text-body-secondary mb-0">Font Size</label>
                <input type="number" class="form-control form-control-sm" id="fontSizeInput" min="8" max="72" style="width: 60px;">
              </div>

              <!-- Font Color -->
              <div class="d-flex align-items-center justify-content-between mb-2 gap-2">
                <label for="fontColorInput" class="form-label small text-body-secondary mb-0">Font Color</label>
                <input type="color" class="form-control form-control-color" id="fontColorInput"
                  value="#000000" title="Choose font color" style="width: 2rem; height: 1.5rem; padding: 0;">
              </div>

              <!-- Show Tag Colors -->
              <div class="form-check form-switch d-flex align-items-center mb-2">
                <input class="form-check-input" type="checkbox" role="switch" id="toggleTagColors">
                <label class="form-check-label" for="toggleTagColors">Show Tag Colors</label>
              </div>

              <!-- Show Background -->
              <div class="form-check form-switch d-flex align-items-center mb-2">
                <input class="form-check-input" type="checkbox" role="switch" id="toggleBackground">
                <label class="form-check-label" for="toggleBackground">Show Background</label>
              </div>

              <!-- Background Color -->
              <div class="d-flex align-items-center justify-content-between mb-3 gap-2">
                <label for="backgroundColorInput" class="form-label small text-body-secondary mb-0">Background Color</label>
                <input type="color" class="form-control form-control-color" id="backgroundColorInput"
                  value="#f0f0f0" title="Choose background color" style="width: 2rem; height: 1.5rem; padding: 0;">
              </div>

              <!-- Overlay Position -->
              <div class="mb-3">
                <label for="overlayPosition" class="form-label small text-body-secondary">Overlay Position</label>
                <div class="input-group">
                  <select class="form-select form-select-sm" id="overlayPosition">
                    <option value="upper_left">Upper Left</option>
                    <option value="upper_right">Upper Right</option>
                    <option value="lower_left">Lower Left</option>
                    <option value="lower_right">Lower Right</option>
                  </select>
                  <button class="btn btn-sm btn-outline-primary" id="applyOverlayPosition">Apply</button>
                </div>
              </div>

            </div>
          </div>
        </div>

        <!-- Leader Lines Card -->
        <div class="card mb-3 shadow-sm">

          <div class="card-header d-flex align-items-center justify-content-between gap-2">
            <!-- Collapse toggle area -->
            <div class="d-flex align-items-center gap-2" role="button"
                data-bs-toggle="collapse"
                data-bs-target="#leaderCollapse"
                aria-expanded="true"
                aria-controls="componentCollapse">
              <img src="../icons/line-diagonal.svg" width="20" height="20" alt="Selected">
              <strong class="small fw-semibold mb-0">Leader Lines</strong>
            </div>

            <!-- Toggle Leader Lines -->

            <div class="form-check form-switch d-flex align-items-center mb-2">
              <input class="form-check-input" type="checkbox" id="toggleLeaderLines" checked>
              <label class="form-check-label ms-2" for="toggleLeaderLines"></label>
            </div>

          </div>

          <div id="leaderCollapse" class="collapse">
            <div class="card-body pt-3 pb-0">

            <!-- Label Angle -->
            <div class="d-flex align-items-center justify-content-between mb-2">
              <label for="leaderAngleSlider" class="form-label small text-body-secondary me-2 mb-0">Label Angle</label>
              <input type="range" class="form-range flex-grow-1 me-2" id="leaderAngleSlider" min="0" max="360" step="5" value="90">
              <output for="leaderAngleSlider" id="leaderAngleValue" class="text-muted small text-nowrap">90°</output>
            </div>

            <!-- Label Offset -->
            <div class="d-flex align-items-center justify-content-between mb-2">
              <label for="leaderLengthSlider" class="form-label small text-body-secondary me-2 mb-0">Label Offset</label>
              <input type="range" class="form-range flex-grow-1 me-2" id="leaderLengthSlider" min="0" max="200" step="1" value="12">
              <output for="leaderLengthSlider" id="leaderLengthValue" class="text-muted small text-nowrap">12″</output>
            </div>


            </div>
          </div>

        </div>

        <!-- Zoom Fading Card -->
        <div class="card mb-3 shadow-sm">

          <div class="card-header d-flex align-items-center justify-content-between gap-2">
            <!-- Collapse toggle area -->
            <div class="d-flex align-items-center gap-2" role="button"
                data-bs-toggle="collapse"
                data-bs-target="#componentCollapse"
                aria-expanded="true"
                aria-controls="componentCollapse">
              <img src="../icons/zoom-center.svg" width="20" height="20" alt="Selected">
              <strong class="small fw-semibold mb-0">Zoom Fading</strong>
            </div>

            <!-- Zoom-Aware -->
            <div class="form-check form-switch d-flex align-items-center mb-2">
              <input class="form-check-input" type="checkbox" id="toggleZoomFade" checked>
              <label class="form-check-label ms-2" for="toggleZoomFade"></label>
            </div>

          </div>

          <div id="componentCollapse" class="collapse">
            <div class="card-body pt-3 pb-0">

             <!-- Start Fading Distance -->
              <div class="d-flex align-items-center justify-content-between mb-2">
                <label for="minFadeSlider" class="form-label small text-body-secondary me-2 mb-0">Fade Start</label>
                <input type="range" class="form-range flex-grow-1 me-2" id="minFadeSlider" min="1" max="1000" step="1" value="10">
                <output for="minFadeSlider" id="minFadeValue" class="text-muted small text-nowrap">10′</output>
              </div>

              <!-- Full Fade Distance -->
              <div class="d-flex align-items-center justify-content-between mb-2">
                <label for="fadeDistanceSlider" class="form-label small text-body-secondary me-2 mb-0">Full Fade</label>
                <input type="range" class="form-range flex-grow-1 me-2" id="fadeDistanceSlider" min="10" max="1000" step="10" value="100">
                <output for="fadeDistanceSlider" id="fadeDistanceValue" class="text-muted small text-nowrap">100′</output>
              </div>

            </div>
          </div>

        </div>

      </div>
    </div>

    <!-- Edit Description Modal -->
    <div class="modal fade" id="editDescriptionModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Component Description</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <textarea id="descriptionInput" class="form-control" rows="5"></textarea>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="saveDescriptionBtn">Save</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Custom Scripts -->
  <script src="../js/theme_toggle.js"></script>
  <script src="../js/overlay_entity.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/description.js"></script>
  
</body>
</html>
