<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" http-equiv="X-UA-Compatible" content="IE=Edge"/>
  <title>LicenseManager</title>

  <link type="text/css" rel="StyleSheet" href="css/licenseManager.css"/>
  <!-- All plugins using this module must define css/main.css to apply plugin-specific css -->
  <link type="text/css" rel="StyleSheet" href="css/main.css">
  <script type="text/javascript" src="js/jquery-1.11.1.min.js"></script>
  <!-- All plugins using this module must define js/main.js  -->
  <script type="text/javascript" src="js/main.js" charset="UTF-8"></script>

</head>

<body>

<div id="header" class="li-top-bar">
  <table id="li-topbarTable">
    <tr>
      <td>
        <img src="images/logo.png"/>
      </td>
    </tr>
  </table>
</div>

<div id="LicInfoWrapper">
  <table class="licenseInfo">
    <tr>
      <td class="li-label localize">Product</td>
      <td class="li-value"><input class="li-input" readonly id="product"></td>
    </tr>

    <tr>
      <td class="li-label localize">Status</td>
      <td class="li-value"><input class="li-input" readonly id="status"></td>
    </tr>

    <tr>
      <td class="li-label localize">Licensed by</td>
      <td class="li-value"><input class="li-input" readonly id="licensor"></td>
    </tr>

    <tr class="extra">
      <td class="li-label localize">Licensed to</td>
      <td class="li-value"><input class="li-input" readonly id="customer"></td>
    </tr>

    <tr class="extra">
      <td class="li-label localize">Email</td>
      <td class="li-value"><input class="li-input" readonly id="email"></td>
    </tr>

    <tr class="extra">
      <td class="li-label localize">License type</td>
      <td class="li-value"><input class="li-input" readonly id="type"></td>
    </tr>

    <tr class="extra">
      <td class="li-label localize">Licensed for</td>
      <td class="li-value"><input class="li-input" readonly id="for"></td>
    </tr>

    <tr class="extra">
      <td class="li-label localize">Expires</td>
      <td class="li-value"><input class="li-input" readonly id="expires"></td>
    </tr>
  </table>

  <table style="margin:0; padding: 0;">
    <tr align="center">
      <td>
        <button id="addLicense" style="display:none" class="li-button localize" onclick="tellSU(this);">Add License..</button>
        <button id="renewLicense" style="display:none" class="li-button localize" onclick="tellSU(this);">Renew License</button>
        <button id="removeLicense" style="display:none" class="li-button localize" onclick="tellSU(this);">Remove License..</button>
      </td>
    </tr>
  </table>

</div>

<script>
  window.location = 'skp:ready';
</script>
</body>
</html>
