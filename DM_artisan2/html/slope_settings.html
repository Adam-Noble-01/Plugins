<!DOCTYPE html>
<html lang="en">
<head>
    <link type="text/css" rel="StyleSheet" href="css/font.css"/>
    <link type="text/css" rel="StyleSheet" href="css/colorPicker.css"/>
    <link type="text/css" rel="StyleSheet" href="css/bootstrap.min.css"/>
    <link type="text/css" rel="StyleSheet" href="css/artisan-bootstrap.css"/>
    <title>Preferences</title>

    <style>
        input.color {
            display:none;
        }
        .input-prepend .colorPicker-picker.add-on {
            height: calc(0.75em + 0.75rem);
            width: 100%;
        }
        .colorPicker-addSwatchContainer {
            display:none;
        }
    </style>

</head>
<body>


<div class="container px-3 small">
    <div class="row pt-2">
        <div class="col-12">
            <form>
                <div class="form-row pt-3">
                    <div class="col-8">
                        <label for="lower_limit" class="localize">Lower Limit %</label>
                    </div>
                    <div class="col-3">
                        <input id="lower_limit" class="form-control form-control-xs text-center" type="text">
                    </div>
                    <div class="col-1">
                        <div class="control-group">
                            <div class="controls input-prepend">
                                <input type="text" id="ll_color" name="color" class="color input-small" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-row pt-3">
                    <div class="col-11">
                        <label for="in_range_color" class="localize">In Range Color</label>
                    </div>
                    <div class="col-1">
                        <div class="control-group">
                            <div class="controls input-prepend">
                                <input type="text" id="in_range_color" name="color" class="color input-small" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-row pt-3">
                    <div class="col-8">
                        <label for="upper_limit" class="localize">Upper Limit %</label>
                    </div>
                    <div class="col-3">
                        <input id="upper_limit" class="form-control form-control-xs text-center" type="text">
                    </div>
                    <div class="col-1">
                        <div class="control-group">
                            <div class="controls input-prepend">
                                <input type="text" id="ul_color" name="color" class="color input-small" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-row pt-3">
                    <div class="col-8">
                        <label class="localize">Gradient</label>
                    </div>
                    <div class="col-3">
                        <div class="custom-control custom-switch text-center">
                            <input id="display_gradient" type="checkbox" class="custom-control-input">
                            <label for="display_gradient" class="custom-control-label"></label>
                        </div>
                    </div>
                </div>

                <div class="form-row pt-3">
                    <div class="col-7">
                        <label for="ratio_format" class="localize">Ratio Format</label>
                    </div>
                    <div class="col-4">
                        <select class="form-control form-control-xs" id="ratio_format">
                            <option class="localize" value="0">Run:Rise</option>
                            <option class="localize" value="1">Rise:Run</option>
                        </select>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <hr>

    <div class="row mt-3">
        <div class="col-6">
            <button id="save" class="btn btn-info btn-block btn-sm"><span class="localize">OK</span></button>
        </div>
        <div class="col-6">
            <button id="cancel" class="btn btn-outline-secondary btn-block btn-sm"><span class="localize">Cancel</span></button>
        </div>
    </div>

</div>

</body>
<script type="text/javascript" src="js/jquery-3.5.1.slim.min.js"></script>
<script type="text/javascript" src="js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="js/jquery.colorPicker.js"></script>
<script type="text/javascript" src="js/main.js"></script>
<script>
    function setColor(id, color) {
        $('#' + id).val(color).change();
    }

    $(function() {
        var $inputs = $('input.color');
        $inputs.colorPicker({pickerDefault: '#99CCFF'});
        ready();
    });

</script>
</html>
